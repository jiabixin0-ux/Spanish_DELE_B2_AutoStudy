name: Daily DELE B2 Study Email

on:
  workflow_dispatch:
  schedule:
    # 00:17 UTC = 08:17 Beijing time. Avoid minute 0 because GitHub may delay or drop schedules at the start of an hour.
    - cron: '17 0 * * *'

jobs:
  send-daily-study-email:
    runs-on: ubuntu-latest
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DELE_COURSE_START_DATE: '2026-05-27'
      DELE_TIMEZONE: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily lesson
        run: python3 scripts/generate_daily_lesson.py

      - name: Generate Word attachment
        run: python3 scripts/generate_word.py

      - name: Send email
        run: python3 scripts/send_email.py
