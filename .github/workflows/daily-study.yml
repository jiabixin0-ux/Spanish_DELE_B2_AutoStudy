name: Daily Spanish Study Email

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 08:00 Beijing time.
    - cron: '0 0 * * *'

jobs:
  send-daily-study-email:
    runs-on: ubuntu-latest
    env:
      DELE_COURSE_START_DATE: '2026-05-27'
      DELE_TIMEZONE: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily lesson
        run: python3 scripts/generate_daily_lesson.py

      - name: Generate Word attachment
        run: python3 scripts/generate_word.py

      - name: Send email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/send_email.py
